cargo-features = ["codegen-backend"]

[workspace]
# `domain` is the wasm-safe domain (invest_domain), `contracts` the invest.v1 gRPC
# stubs (invest_contracts), `core` the invest-core server: gRPC, the unit ledger in
# TigerBeetle, the outbox and its relay; `cabinet/backend` the cabinet's BFF. Same shape
# as banking's workspace, which the allocation code was moved out of (9ffafce3).
members = ["cabinet/backend", "contracts", "core", "domain"]
# `.tb-client` must live at the repo root, NOT inside a member dir: cargo's
# exclude check is `!explicit_member && excluded`, and member matching is
# prefix-based — anything under a member dir can never be excluded.
exclude = [".tb-client"]
resolver = "3"

[workspace.dependencies]
async-trait = "0.1.89"
# The cabinet BFF's HTTP server; `ws` for the order book's live feed.
axum = "0.8"
# banking's `domain` crate, only for `domain::window_export`: the wire format of the migration
# window's export, read with the very structs that write it (plan §6.5, step 2/3). By git and
# rev: the head of banking#552 (fen/window-export). Replace the rev with the commit on banking
# `main` once #552 is merged; nothing else of the crate is used.
banking_domain = { git = "https://github.com/EV-Main/banking.git", rev = "c4ed3daf70a6e0035ed5b4ed8d3e213386ae1747", package = "domain" }
color-eyre = "0.6"
dotenvy = "0.15.7"
ev = { version = "0.24.2", package = "ev_lib", default-features = false, features = ["architecture"] }
# banking's wire contracts: `scope.v1.ScopeLedgerService`, the money port's adapter. By
# git and by rev — the pin is the whole statement of which banking invest speaks to.
# cf38ba57: holds, MoneyEvents, Payout/RequestPayout and mandates are served; the wire is the
# one 9ffafce3 (the snapshot the allocation code was moved from) already carried.
evbanking_contracts = { git = "https://github.com/EV-Main/banking.git", rev = "7635ab1e0dde8235786c8612d2ec0cbb8a158ced" }
# The concierge verify flow: invest-core accepts access tokens of the `invest` relying
# party and verifies them locally against concierge's JWKS. v0.16.0, the deployed one.
evconcierge_auth = { git = "https://github.com/EV-Main/concierge.git", rev = "151a347d79abf131c58d7da87d61ae6f52ae3239" }
# A relying party's calls into concierge: invest-core publishes its permission catalog with
# it (`AuthService.PublishCatalog`, client credential); the cabinet BFF signs people in with
# its code flow (PKCE, ExchangeCode, RefreshClientToken, GetMe). 0.3.0: it speaks
# evconcierge_contracts 0.3, the copy evconcierge_projection links.
evconcierge_client = "0.3.0"
# The pull engine over concierge's lifecycle and scope streams (cursors, dedupe, per-key
# order, parking) that the `users` projection is written by. concierge's own published crate
# (`projection/`), so invest keeps no second copy of the stream contract (concierge
# docs/SCOPES-AND-APPROVALS.md §4). `pg` is its Postgres bookkeeping store.
evconcierge_projection = { version = "0.3.0", default-features = false, features = ["pg"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
invest_contracts = { path = "contracts" }
invest_domain = { path = "domain" }
prost = "0.14"
# HKDF + ChaCha20-Poly1305 for the cabinet BFF's sealed session tokens. Already linked by
# the TLS stack (tonic `tls-ring`, rustls), so no new crate.
ring = "0.17"
# Only to name a process-level crypto provider: tonic carries `ring`, and rustls refuses
# to guess when two providers are linked (see `core/src/crypto.rs`).
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
# The cabinet BFF names a session row by the hash of its cookie, never by the cookie.
sha2 = "0.11"
sqlx = "0.9.0"
# Constant-time comparison of the CSRF pair and the sign-in state.
subtle = "2.6"
thiserror = "2.0.18"
# via the symlink (kept current by the flake shellHook), not the canonicalized store path - hardcoding the hash goes stale on every tigerbeetle derivation rebuild
tigerbeetle = { path = ".tb-client" }
tokio = "1.52.3"
# `TcpListenerStream`, so a test server can be handed an already-bound listener rather
# than re-binding a port it just released.
tokio-stream = { version = "0.1.18", default-features = false, features = ["net"] }
# CancellationToken for cooperative graceful shutdown (signal → drain → exit).
tokio-util = { version = "0.7.18", default-features = false }
tonic = "0.14"
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = "0.5.3"
tower-http = "0.6.11"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = "1.23.2"

[workspace.lints.rust]
unused_features = "allow"

# smaller target/: trim debuginfo (deps need none), keep line tables for backtraces
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

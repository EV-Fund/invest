[package]
name = "invest-core"
version = "0.1.0"
edition = "2024"
description = "invest-core — the allocation engine: the registry of investable products, the unit ledger in TigerBeetle, in-kind issuance, ownership and NAV, served over gRPC."
license = "BlueOak-1.0.0"
publish = false
default-run = "invest-core"

[[bin]]
name = "invest-core"
path = "src/main.rs"

[features]
# Seams the integration tests need (`ScopeLedgerClient::with_parts`) and production must not
# have. The tests switch it on through the dev-dependency on this crate below.
test-support = []

[dependencies]
async-trait.workspace = true
banking_domain.workspace = true
color-eyre.workspace = true
dotenvy.workspace = true
ev = { workspace = true, features = ["error_monitoring", "otel", "settings"] }
evbanking_contracts.workspace = true
evconcierge_auth.workspace = true
evconcierge_client.workspace = true
evconcierge_projection.workspace = true
invest_contracts.workspace = true
invest_domain.workspace = true
# The process-level crypto provider `main` installs before any TLS client is built (`crypto.rs`).
rustls.workspace = true
serde = { workspace = true }
serde_json.workspace = true
# SHA-256 of the window export file (workspace dep, already linked by the cabinet BFF).
sha2.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "migrate"] }
thiserror.workspace = true
tigerbeetle.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util.workspace = true
tonic = { workspace = true, features = ["tls-ring", "tls-webpki-roots"] }
tonic-health.workspace = true
tower.workspace = true
tower-http = { workspace = true, features = ["trace"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json"] }
uuid = { workspace = true, features = ["v4", "v5"] }

[dev-dependencies]
# Self-reference: turns `test-support` on for this crate's own integration tests.
invest-core = { path = ".", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tokio-stream.workspace = true

[lints]
workspace = true
